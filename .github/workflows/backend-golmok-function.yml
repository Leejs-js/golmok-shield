name: Backend CI/CD - golmok-function

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-golmok-function.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Verify backend
        working-directory: backend
        run: npm run verify
      - name: Keep production dependencies only
        working-directory: backend
        run: npm prune --omit=dev
      - name: Upload backend package
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          include-hidden-files: false
          path: |
            backend/dist
            backend/host.json
            backend/node_modules
            backend/package.json
            backend/package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_test
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: backend

      - name: Deploy backend Function App
        uses: Azure/functions-action@v1
        with:
          app-name: golmok-function
          package: backend
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          sku: flexconsumption

      - name: Verify deployed backend
        env:
          BACKEND_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo "::error::GitHub Actions Secret NEXT_PUBLIC_API_BASE_URL이 필요합니다."
            exit 1
          fi
          curl --fail --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 10 --max-time 60 \
            "${BACKEND_BASE_URL%/}/api/recommend/health"

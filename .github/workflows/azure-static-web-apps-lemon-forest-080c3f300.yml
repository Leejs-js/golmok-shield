name: Azure Static Web Apps CI/CD - main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend environment
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          set -e

          if [ -z "$NEXT_PUBLIC_API_BASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_API_BASE_URL secret is required."
            echo "::error::예: https://golmok-function-xxxxx.koreacentral-01.azurewebsites.net"
            exit 1
          fi

          if ! echo "$NEXT_PUBLIC_API_BASE_URL" | grep -Eq '^https?://'; then
            echo "::error::NEXT_PUBLIC_API_BASE_URL must start with http:// or https://"
            exit 1
          fi

          if echo "$NEXT_PUBLIC_API_BASE_URL" | grep -Eq '/api/?$'; then
            echo "::error::NEXT_PUBLIC_API_BASE_URL must be the Function App root URL, not an /api URL."
            echo "::error::올바른 예: https://golmok-function-xxxxx.koreacentral-01.azurewebsites.net"
            echo "::error::잘못된 예: https://golmok-function-xxxxx.koreacentral-01.azurewebsites.net/api"
            exit 1
          fi

          if echo "$NEXT_PUBLIC_API_BASE_URL" | grep -Eq 'azurestaticapps\.net'; then
            echo "::error::NEXT_PUBLIC_API_BASE_URL must be the backend Function App URL, not the Static Web App URL."
            echo "::error::예: https://golmok-function-xxxxx.koreacentral-01.azurewebsites.net"
            exit 1
          fi

          echo "NEXT_PUBLIC_API_BASE_URL is configured."

      - name: Build static frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_KAKAO_MAP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_KEY }}
        run: npm run build

      - name: Check static output
        working-directory: frontend
        run: |
          test -d out
          du -sh out

      - name: Deploy static output
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_FOREST_080C3F300 }}
          action: "upload"
          app_location: "frontend/out"
          api_location: ""
          output_location: ""
          skip_app_build: true
